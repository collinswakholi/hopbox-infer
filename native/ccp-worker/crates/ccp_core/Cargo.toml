[package]
name = "ccp_core"
version = "0.1.0"
edition = "2021"
description = "Speedy color science, chart refs, fit maps, and CCP FFC/GC/WB stages"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "exr"] }
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
